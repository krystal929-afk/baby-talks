name: Deploy Baby to Cloudflare once

on:
  push:
    branches:
      - baby-firefly-clean

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy Baby to Cloudflare once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npm run deploy
