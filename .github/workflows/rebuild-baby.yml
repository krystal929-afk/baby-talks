name: Rebuild Baby Firefly

on:
  push:
    branches:
      - baby-firefly-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: baby-firefly-clean
          fetch-depth: 0

      - name: Fetch source branches
        run: |
          git fetch origin baby-firefly-migration
          git fetch origin main

      - name: Rebuild Lovable-free files
        shell: bash
        run: |
          set -e

          SRC="origin/baby-firefly-migration"

          copy() {
            mkdir -p "$(dirname "$2")"
            git show "$SRC:$1" > "$2"
          }

          # Remove Lovable-only material
          rm -rf .lovable
          rm -f .env package-lock.json bun.lockb

          rm -f src/routes/mcp.ts
          rm -rf 'src/routes/[.mcp]'
          rm -rf 'src/routes/[.well-known]'
          rm -f 'src/routes/[.]lovable.oauth.consent.ts'

          # Remove remaining Lovable MCP library
          rm -rf src/lib/mcp

          # Root files
          for f in \
            bunfig.toml \
            components.json \
            eslint.config.js \
            package.json \
            tsconfig.json \
            vite.config.ts \
            wrangler.jsonc
          do
            copy "$f" "$f"
          done

          # Public
          for f in \
            app-icon-192.png \
            app-icon-512.png \
            favicon.png \
            manifest.webmanifest \
            sw.js
          do
            copy "$f" "public/$f"
          done

          # Brand assets
          for f in \
            logo-green.png \
            logo-primary.png \
            logo-utility.png
          do
            copy "$f" "src/assets/brand/$f"
          done

          # Components
          for f in \
            auth-gate.tsx \
            baby-bubble.tsx \
            baby-chat.tsx \
            baby-mood.tsx \
            push-toggle.tsx \
            ransom-toast.tsx \
            reminder-watcher.tsx
          do
            copy "$f" "src/components/$f"
          done

          # UI components
          for f in \
            accordion.tsx \
            alert-dialog.tsx \
            alert.tsx \
            aspect-ratio.tsx \
            avatar.tsx \
            badge.tsx \
            breadcrumb.tsx \
            button.tsx \
            card.tsx \
            carousel.tsx \
            chart.tsx \
            checkbox.tsx \
            collapsible.tsx \
            command.tsx \
            context-menu.tsx \
            dialog.tsx \
            drawer.tsx \
            dropdown-menu.tsx \
            form.tsx \
            hover-card.tsx \
            input-otp.tsx \
            input.tsx \
            label.tsx \
            menubar.tsx \
            navigation-menu.tsx \
            pagination.tsx \
            popover.tsx \
            progress.tsx \
            radio-group.tsx \
            resizable.tsx \
            scroll-area.tsx \
            select.tsx \
            separator.tsx \
            sheet.tsx \
            sidebar.tsx \
            skeleton.tsx \
            slider.tsx \
            sonner.tsx \
            switch.tsx \
            table.tsx \
            tabs.tsx \
            textarea.tsx \
            toggle-group.tsx \
            toggle.tsx \
            tooltip.tsx
          do
            copy "$f" "src/components/ui/$f"
          done

          # Hooks
          git show origin/main:src/hooks/use-dictation.ts > src/hooks/use-dictation.ts
          copy use-mobile.tsx src/hooks/use-mobile.tsx
          copy use-voice-pref.ts src/hooks/use-voice-pref.ts

          # Supabase integration
          copy auth-attacher.ts src/integrations/supabase/auth-attacher.ts
          copy auth-middleware.ts src/integrations/supabase/auth-middleware.ts
          copy client.server.ts src/integrations/supabase/client.server.ts
          copy client.ts src/integrations/supabase/client.ts
          copy types.ts src/integrations/supabase/types.ts

          # Libraries
          for f in \
            audio.ts \
            push-config.ts \
            push.functions.ts \
            speak.ts \
            stings.ts \
            utils.ts
          do
            copy "$f" "src/lib/$f"
          done

          # Routes
          copy __root.tsx src/routes/__root.tsx
          copy brain.tsx src/routes/brain.tsx
          copy calendar.tsx src/routes/calendar.tsx
          copy index.tsx src/routes/index.tsx
          copy send-due-reminders.ts src/routes/api/public/hooks/send-due-reminders.ts

          # Server
          for f in \
            ai-gateway.ts \
            baby.functions.ts \
            chat.functions.ts \
            memories.functions.ts \
            voice.functions.ts
          do
            copy "$f" "src/server/$f"
          done

          # App core
          copy routeTree.gen.ts src/routeTree.gen.ts
          copy router.tsx src/router.tsx
          copy start.ts src/start.ts
          copy styles.css src/styles.css

          # Supabase
          copy config.toml supabase/config.toml

          for f in \
            20260424171809_f2ba23c3-7efc-41a1-b9f1-dccb83d17b50.sql \
            20260424171828_77b5b213-0e28-4c68-9862-f8ea5edfedb6.sql \
            20260508145809_45ff6c6b-9050-4b78-bfc5-711454ab777a.sql \
            20260508235113_f94e5257-a2be-444b-83bf-417ddbb4a4ef.sql \
            20260509001326_841a70f6-06ce-4a35-8732-cfdd35155c7b.sql \
            20260509004041_07b5a7e1-fc75-4ea3-ad80-f65601ee28d6.sql \
            20260509215651_755f5063-d017-4116-bf75-bdeafeace477.sql \
            20260510035730_e487f829-6731-42bb-b8fe-fcd720170ee8.sql \
            20260510042953_0e3aaaea-3e28-4400-bc54-90cc538eee4b.sql \
            20260510051144_993cb1c8-ec13-4762-9b93-6dd5e9acaccf.sql
          do
            copy "$f" "supabase/migrations/$f"
          done

          copy \
            001_baby_firefly_secure_schema.sql \
            supabase/migrations_freedom/001_baby_firefly_secure_schema.sql

          copy \
            README.md \
            supabase/migrations_freedom/README.md

      - name: Install dependencies
        run: npm install

      - name: Build Baby Firefly
        run: npm run build

      - name: Commit clean Baby Firefly
        run: |
          git config user.name "Baby Firefly Migration"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Lovable-free Baby Firefly"
          git push origin HEAD:baby-firefly-clean
